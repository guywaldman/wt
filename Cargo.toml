[package]
name = "wt"
version = "0.1.3"
edition = "2024"
description = "Small git worktree helper CLI"
repository = "https://github.com/guywaldman/wt"
readme = "README.md"

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
gix = "0.84.0"
log = "0.4.29"
pretty_env_logger = "0.5.0"

[dev-dependencies]
utils = { path = "tests/utils" }
